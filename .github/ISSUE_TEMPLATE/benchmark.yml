name: Benchmark result
description: Share a reproducible gain, no-gain result or loss of evidence.
title: 'bench: '
labels: [benchmark]
body:
  - type: textarea
    id: question
    attributes:
      label: User question and required evidence
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Exact commands, source revision and tool versions
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Raw/candidate/selected bytes, missing evidence and filter time
      description: Attach the sanitized ats bench report. Provider billing is a separate measurement.
    validations:
      required: true
