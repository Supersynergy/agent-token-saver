name: Bug report
description: Report lost evidence, incorrect exits or installation/rollback problems.
title: 'bug: '
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: ATS version, Bun version and OS
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction and observed result
      description: Include the exact argv, exit code and sanitized result. Do not attach raw private logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected evidence or behavior
    validations:
      required: true
